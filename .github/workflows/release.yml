name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build release
        run: |
          chmod +x ./scripts/build-release.sh
          ./scripts/build-release.sh ${{ steps.version.outputs.VERSION }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: .build/release/ClaudeUsageWidget-${{ steps.version.outputs.VERSION }}.dmg
          body: |
            ## Installation

            1. Download the DMG file
            2. Open DMG and drag app to Applications
            3. Run in Terminal (required for unsigned apps):
               ```bash
               xattr -cr /Applications/ClaudeUsageWidget.app
               ```
            4. Open the app

            ## Requirements

            - macOS 13.0+
            - [Claude Code CLI](https://docs.anthropic.com/en/docs/claude-code) installed and logged in
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
